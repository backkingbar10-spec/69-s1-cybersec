services:
  db:
    image: postgres:16-alpine
    container_name: 69-s1-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - ./data:/var/lib/postgresql/data

  admin:
    image: dpage/pgadmin4
    container_name: 69-s1-admin
    ports:
      - "8081:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PG_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PG_PASS}
    volumes:
      - ./pgadmin:/var/lib/pgadmin
    depends_on:
      - db

  mailpit:
    image: axllent/mailpit
    container_name: 69-s1-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  app:
    build: ./strapi-app
    container_name: 69-s1-app
    ports:
      - "9091:1337"
    environment:
      - DATABASE_CLIENT=postgres
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_NAME=${DB_NAME}
      - DATABASE_USERNAME=${DB_USER}
      - DATABASE_PASSWORD=${DB_PASS}
      - DATABASE_SSL=false
      - JWT_SECRET=${APP_JWT_SECRET}
      - ADMIN_JWT_SECRET=${APP_ADMIN_JWT_SECRET}
      - APP_KEYS=${APP_KEYS}
      - API_TOKEN_SALT=${APP_API_TOKEN_SALT}
      - TRANSFER_TOKEN_SALT=${APP_TRANSFER_TOKEN_SALT}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - RESET_PASSWORD_URL=${RESET_PASSWORD_URL}
    depends_on:
      - db

  frontend:
    image: nginx:alpine
    container_name: 69-s1-frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - app